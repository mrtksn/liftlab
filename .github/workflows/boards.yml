name: Board firmware and host programs
on:
  push:
    paths: ['runner/**', 'js/board-hardware.js', 'js/hardware*.js', 'js/agent*.js', 'js/driver-presets.js', 'js/install-ui.js', 'js/boards.js', 'js/autotune.js', 'js/laws.js', 'js/tuning.js', 'js/rn-bridge.js', 'js/computers-ui.js', 'tools/test*.js', 'tools/test_learning_native.c', 'tools/test_hardware*', 'tools/autotune_math_probe.c', 'tools/test_pi*', 'tools/test_sensor_drivers.c', 'tools/test_motor_outputs.c', 'tools/pwm-stubs/**', 'tools/sync_driver_presets.py', 'tools/build_firmware.sh', 'tools/check_firmware_fresh.sh', 'firmware/manifest.json', '.github/workflows/boards.yml']
  pull_request:
    paths: ['runner/**', 'js/board-hardware.js', 'js/hardware*.js', 'js/agent*.js', 'js/driver-presets.js', 'js/install-ui.js', 'js/boards.js', 'js/autotune.js', 'js/laws.js', 'js/tuning.js', 'js/rn-bridge.js', 'js/computers-ui.js', 'tools/test*.js', 'tools/test_learning_native.c', 'tools/test_hardware*', 'tools/autotune_math_probe.c', 'tools/test_pi*', 'tools/test_sensor_drivers.c', 'tools/test_motor_outputs.c', 'tools/pwm-stubs/**', 'tools/sync_driver_presets.py', 'tools/build_firmware.sh', 'tools/check_firmware_fresh.sh', 'firmware/manifest.json', '.github/workflows/boards.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Each chip and role built as the installer serves it (tools/build_firmware.sh), stamped with this commit.
  esp:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    strategy:
      matrix:
        chip: [esp32, esp32s3, esp32c3]
        role: [flight, ground]
    steps:
      - uses: actions/checkout@v4
      - name: Build the firmware bundle
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          ONLY=${{ matrix.chip }}-${{ matrix.role }} DFB_FW_COMMIT=${GITHUB_SHA::7} sh tools/build_firmware.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.chip }}-${{ matrix.role }}
          path: firmware/${{ matrix.chip }}-${{ matrix.role }}/
          retention-days: 3
  # The six bundles and their manifest as one artifact (firmware-COMMIT): unzip it over firmware/ and commit it to
  # publish this build (docs/deployment.md). It warns when the checked-in bundles are older than the source.
  firmware:
    needs: esp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Are the checked-in bundles current?
        run: sh tools/check_firmware_fresh.sh || echo "::warning title=Firmware bundles are stale::firmware/ is older than the firmware source. Unzip this run's firmware-${GITHUB_SHA::7} artifact over firmware/ and commit it (docs/deployment.md)."
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: /tmp/bundles
      - name: Write the manifest
        run: |
          for d in /tmp/bundles/bundle-*; do n=${d#/tmp/bundles/bundle-}; rm -rf "firmware/$n"; mkdir -p "firmware/$n"; cp -R "$d/." "firmware/$n/"; done
          MANIFEST_ONLY=1 DFB_FW_COMMIT=${GITHUB_SHA::7} sh tools/build_firmware.sh
          echo "FW_NAME=firmware-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FW_NAME }}
          path: |
            firmware/manifest.json
            firmware/esp32-flight/
            firmware/esp32-ground/
            firmware/esp32s3-flight/
            firmware/esp32s3-ground/
            firmware/esp32c3-flight/
            firmware/esp32c3-ground/
          retention-days: 30
  host:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - run: sh runner/ground/build.sh
      - if: runner.os == 'Linux'
        run: sh runner/pi/build.sh
      - if: runner.os == 'Linux'
        name: Ground and Pi radio integration tests
        run: sh tools/test_radio_e2e.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/test_board_install.js
      - run: node tools/test_hardware_wiring.js
      - run: node tools/test_agent_hardware.js
      - run: node tools/test_driver_presets.js
      - run: node tools/test_flight_physics.js
      - run: node tools/test_learning.js
      - name: Learning model validation and bounded test commands
        run: |
          cc -O1 -Wall -Wextra -Werror -Wno-unused-parameter -fsanitize=undefined -Irunner -Irunner/fc tools/test_learning_native.c runner/fc/fc_core.c runner/fc/nav_core.c runner/rn_host.c runner/rn.c runner/pi/rn_builtin_pi.c -lm -o /tmp/test-learning
          /tmp/test-learning
      - name: Hardware measured tuning, transactions and Pi command client
        run: sh tools/test_hardware_tuning.sh
      - run: node tools/test_wasm_meter.js
      - run: python3 tools/sync_driver_presets.py --check
      - name: Sensor driver register tests
        run: |
          cc -Wall -Wextra -Werror -fsanitize=undefined -Irunner/fc -Irunner tools/test_sensor_drivers.c -lm -o /tmp/test-sensors
          /tmp/test-sensors
      - name: Packet radio and USB bridge tests
        run: |
          cc -Wall -Wextra -Werror -fsanitize=undefined -Irunner -Irunner/fc runner/fc/test_plink.c runner/fc/plink.c runner/fc/radio_link.c runner/fc/crsf.c runner/fc/tlm_crsf.c runner/fc/tlm_core.c runner/fc/rc_core.c runner/fc/pickup_core.c -lm -o /tmp/test-plink
          /tmp/test-plink
          cc -Wall -Wextra -Werror -fsanitize=undefined -Irunner -Irunner/fc runner/fc/test_pserial.c runner/fc/pframe.c runner/fc/plink.c runner/fc/radio_link.c runner/fc/crsf.c runner/fc/tlm_crsf.c runner/fc/tlm_core.c runner/fc/rc_core.c runner/fc/pickup_core.c -lm -o /tmp/test-pserial
          /tmp/test-pserial
          cc -Wall -Wextra -Werror -fsanitize=undefined -Irunner -Irunner/fc runner/fc/test_clink.c runner/fc/clink.c runner/fc/plink.c runner/fc/radio_link.c runner/fc/crsf.c runner/fc/tlm_crsf.c runner/fc/tlm_core.c runner/fc/rc_core.c runner/fc/pickup_core.c -lm -o /tmp/test-clink
          /tmp/test-clink
          cc -Wall -Wextra -Werror -fsanitize=undefined -Irunner -Irunner/fc runner/fc/test_nrf24.c runner/fc/nrf24.c runner/fc/clink.c runner/fc/plink.c runner/fc/radio_link.c runner/fc/crsf.c runner/fc/tlm_crsf.c runner/fc/tlm_core.c runner/fc/rc_core.c runner/fc/pickup_core.c -lm -o /tmp/test-nrf24
          /tmp/test-nrf24
          cc -Wall -Wextra -Werror -fsanitize=undefined -Irunner -Irunner/fc runner/fc/test_lmux.c runner/fc/lmux.c runner/fc/plink.c runner/fc/radio_link.c runner/fc/crsf.c runner/fc/tlm_crsf.c runner/fc/tlm_core.c runner/fc/rc_core.c runner/fc/pickup_core.c -lm -o /tmp/test-lmux
          /tmp/test-lmux
          cc -Wall -Wextra -Werror -fsanitize=undefined -Irunner -Irunner/fc runner/fc/test_peer.c runner/fc/peer.c runner/fc/plink.c runner/fc/radio_link.c runner/fc/crsf.c runner/fc/tlm_crsf.c runner/fc/tlm_core.c runner/fc/rc_core.c runner/fc/pickup_core.c -lm -o /tmp/test-peer
          /tmp/test-peer
          cc -Wall -Wextra -Werror -fsanitize=undefined -Irunner -Irunner/fc runner/fc/test_fleet.c runner/fc/fleet_core.c runner/fc/fleet_link.c runner/fc/peer.c runner/fc/plink.c runner/fc/rc_core.c runner/fc/pickup_core.c runner/fc/nav_core.c runner/fc/radio_link.c runner/fc/crsf.c runner/fc/tlm_crsf.c runner/fc/tlm_core.c runner/rn_host.c runner/rn.c runner/rn_builtin.c -lm -o /tmp/test-fleet
          /tmp/test-fleet
          cc -Wall -Wextra -Werror -fsanitize=undefined -Irunner -Irunner/fc runner/esp_radio/test_esp_radio.c runner/esp_radio/usb_split.c runner/fc/crsf.c -lm -o /tmp/test-esp-radio
          /tmp/test-esp-radio
          cc -Wall -Wextra -Werror -fsanitize=undefined -Irunner -Irunner/fc runner/fc/test_bus.c runner/fc/bus.c -o /tmp/test-bus
          /tmp/test-bus
          node tools/prog_test_data.js /tmp/prog
          cc -Wall -Wextra -Werror -fsanitize=undefined -Irunner runner/fc/test_prog.c runner/fc/prog_core.c runner/fc/bus.c runner/rn_host.c runner/rn.c -lm -o /tmp/test-prog
          /tmp/test-prog /tmp/prog/prog.rnp
      - name: Motor output and legacy wiring tests
        run: |
          for chip in ESP32 ESP32S3 ESP32C3; do
            cc -Wall -Wextra -Werror -fsanitize=undefined -DCONFIG_IDF_TARGET_$chip=1 -Itools/pwm-stubs -Irunner -Irunner/fc tools/test_motor_outputs.c runner/fc/radio_link.c -lm -o /tmp/test-motors
            /tmp/test-motors
          done
